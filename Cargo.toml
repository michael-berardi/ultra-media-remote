[package]
name = "ultra-media-remote"
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
description = "macOS Now Playing info and media transport control through runtime-only MediaRemote access, via a small Swift static library."
license = "MIT"
authors = ["Pareto Cybernetics"]
readme = "README.md"
repository = "https://github.com/michael-berardi/ultra-media-remote"
homepage = "https://github.com/michael-berardi/ultra-media-remote"
keywords = ["macos", "media", "now-playing", "media-remote"]
categories = ["os::macos-apis"]
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Opt-in live system-output spectrum (11-band EQ data). Requires macOS 15+ at
# runtime and Screen Recording permission for the calling app.
spectrum = []

[[bin]]
name = "ultra-media-remote"
path = "src/bin/ultra-media-remote.rs"

[[example]]
name = "nowplaying"

[[example]]
name = "spectrum"
required-features = ["spectrum"]
